[project]
name = "agent-trial-runner"
version = "0.1.0"
description = "An evaluation platform for AI travel agents."
requires-python = ">=3.11"
# botocore[crt] is required to read `aws login` credentials, which is the
# sign-in AWS recommends over long-lived root access keys.
dependencies = ["boto3>=1.35.0", "botocore[crt]>=1.35.0"]

[project.scripts]
trial-runner = "trial_runner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is `agent-trial-runner`; the import stays `trial_runner`,
# because `from agent_trial_runner.world import World` helps nobody.
module-name = "trial_runner"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests", "infra"]

# boto3 ships no type information. Untyped rather than ignored wholesale, so a
# mistake in our own code around these calls is still caught.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
